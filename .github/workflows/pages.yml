# Runs the tests on every push. GitHub Pages publishes the site itself, from the main branch:
# it serves the repository root, where index.html forwards visitors to public/.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
